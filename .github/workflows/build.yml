name: 构建带有BBRv3的内核

'on':
  workflow_dispatch:
    inputs:
      force_rebuild:
        description: "Force rebuild even if releases already exist"
        required: false
        type: boolean
        default: false
      kernel_version:
        description: "Specify kernel version (e.g. 6.14.2 or 6.14)"
        required: false
        type: string
        default: ""
  schedule:
    # Daily automatic kernel refresh. BBRv3 itself stays pinned to the repo patch.
    - cron: "17 3 * * *"

env:
  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  GH_REPO: ${{ github.repository }}

permissions:
  contents: write
  actions: write

concurrency:
  group: bbrv3-kernel-build
  cancel-in-progress: true

jobs:
  preflight:
    runs-on: ubuntu-latest
    outputs:
      kernel_version: ${{ steps.plan.outputs.kernel_version }}
      raw_kernel_version: ${{ steps.plan.outputs.raw_kernel_version }}
      build_needed: ${{ steps.plan.outputs.build_needed }}
      force_rebuild: ${{ steps.plan.outputs.force_rebuild }}
    steps:
      - name: 检查最新内核和已发布版本
        id: plan
        env:
          INPUT_FORCE_REBUILD: ${{ inputs.force_rebuild }}
          INPUT_KERNEL_VERSION: ${{ inputs.kernel_version }}
        run: |
          set -euo pipefail

          force_rebuild="${INPUT_FORCE_REBUILD:-false}"
          user_kernel_version=$(echo "${INPUT_KERNEL_VERSION:-}" | sed -e 's/^[[:space:]]*//' -e 's/[[:space:]]*$//' -e 's/^v//')

          if [ -n "$user_kernel_version" ]; then
            raw_version="$user_kernel_version"
          else
            raw_version=$(curl -fsSL https://www.kernel.org/finger_banner \
              | awk -F: '/latest stable version/ {gsub(/^[ \t]+|[ \t]+$/, "", $2); print $2; exit}')
            if [ -z "$raw_version" ]; then
              echo "Failed to read latest stable kernel version from kernel.org." >&2
              exit 1
            fi
          fi

          version="$raw_version"
          if [[ "$version" =~ ^[0-9]+\.[0-9]+$ ]]; then
            version="${version}.0"
          fi
          if ! [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Unexpected stable kernel version: $raw_version" >&2
            exit 1
          fi

          echo "raw_kernel_version=$raw_version" >> "$GITHUB_OUTPUT"
          echo "kernel_version=$version" >> "$GITHUB_OUTPUT"
          echo "force_rebuild=$force_rebuild" >> "$GITHUB_OUTPUT"

          if [ "$force_rebuild" = "true" ]; then
            echo "build_needed=true" >> "$GITHUB_OUTPUT"
            echo "force_rebuild is enabled; skipping release check and forcing build."
          else
            missing=0
            for arch in x86_64 arm64; do
              for suffix in "" "-max"; do
                tag="$arch-$version$suffix"
                if gh release view "$tag" >/dev/null 2>&1; then
                  echo "$tag already exists."
                else
                  echo "$tag is missing."
                  missing=1
                fi
              done
            done

            if [ "$missing" -eq 0 ]; then
              echo "build_needed=false" >> "$GITHUB_OUTPUT"
              echo "All releases for $version already exist; ending workflow before build."
            else
              echo "build_needed=true" >> "$GITHUB_OUTPUT"
              echo "At least one release for $version is missing; build will continue."
            fi
          fi

  cleanup:
    needs: preflight
    if: needs.preflight.outputs.build_needed == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: 删除旧的工作流运行记录
        uses: Mattraks/delete-workflow-runs@main
        with:
          retain_days: 0
          keep_minimum_runs: 0

  build:
    needs: [preflight, cleanup]
    if: ${{ always() && needs.preflight.outputs.build_needed == 'true' && needs.cleanup.result == 'success' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            runs_on: ubuntu-latest
            profile: standard
            profile_name: BBRv3
            release_suffix: ""
            localversion: -bbrv3
          - arch: arm64
            runs_on: ubuntu-24.04-arm
            profile: standard
            profile_name: BBRv3
            release_suffix: ""
            localversion: -bbrv3
          - arch: x86_64
            runs_on: ubuntu-latest
            profile: max
            profile_name: BBRv3 Max
            release_suffix: -max
            localversion: -bbrv3-max
          - arch: arm64
            runs_on: ubuntu-24.04-arm
            profile: max
            profile_name: BBRv3 Max
            release_suffix: -max
            localversion: -bbrv3-max
    runs-on: ${{ matrix.runs_on }}
    env:
      ARCH: ${{ matrix.arch }}
      KERNEL_VERSION: ${{ needs.preflight.outputs.kernel_version }}
      FORCE_REBUILD: ${{ needs.preflight.outputs.force_rebuild }}
    steps:
      - name: 检查是否已发布
        id: check_release
        run: |
          tag="${{ matrix.arch }}-${{ env.KERNEL_VERSION }}${{ matrix.release_suffix }}"
          if [ "${FORCE_REBUILD:-false}" = "true" ]; then
            echo "BUILD_NEEDED=true" >> "$GITHUB_ENV"
            echo "FORCE_REBUILD is enabled; building latest kernel with ${{ matrix.profile_name }} even if $tag exists."
          elif gh release view "$tag" >/dev/null 2>&1; then
            echo "BUILD_NEEDED=false" >> "$GITHUB_ENV"
            echo "$tag already exists; skipping build."
          else
            echo "BUILD_NEEDED=true" >> "$GITHUB_ENV"
            echo "$tag does not exist; building latest kernel with ${{ matrix.profile_name }}."
          fi

      - name: 检出代码
        if: env.BUILD_NEEDED == 'true'
        uses: actions/checkout@v4

      - name: 安装依赖项
        if: env.BUILD_NEEDED == 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            git build-essential \
            libncurses-dev libssl-dev libelf-dev \
            bison bc flex rsync debhelper \
            dpkg-dev fakeroot kmod cpio dwarves \
            libdw-dev lz4 zstd xz-utils curl jq

      - name: 创建源码目录
        if: env.BUILD_NEEDED == 'true'
        run: mkdir -p ./kernel/linux

      - name: 下载内核源代码
        if: env.BUILD_NEEDED == 'true'
        working-directory: ./kernel
        run: |
          branch=$(echo "${{ env.KERNEL_VERSION }}" | grep -oP '^\d+\.\d+')
          git clone --depth=1 --branch linux-$branch.y \
            https://github.com/gregkh/linux.git linux

      - name: 应用 BBRv3 补丁
        if: env.BUILD_NEEDED == 'true'
        working-directory: ./kernel/linux
        run: |
          bash "$GITHUB_WORKSPACE/scripts/apply-bbrv3-port.sh"
          grep -n "BBR_VERSION" net/ipv4/tcp_bbr.c

      - name: 补丁质量断言
        if: env.BUILD_NEEDED == 'true'
        working-directory: ./kernel/linux
        run: |
          # 模糊应用（fuzz）通过不代表补丁语义正确：patch 的退出码只说明 hunk
          # 被接受，不说明落在预期位置。这里做结构性断言，并保留 .rej/.orig 供排查。
          if find . -name '*.rej' | grep -q .; then
            echo "ERROR: 存在被拒绝的补丁 hunk (.rej)，构建产物不可信。"
            find . -name '*.rej' -print
            exit 1
          fi

          # BBRv3 新增的核心符号必须存在。
          # 注意：这里只能选【补丁新增】的符号。BBRv2 的遗留符号（如
          # bbr_update_bw、bbr_set_cwnd）恰恰是 v3 补丁要删除的，
          # 拿它们做断言必然失败（曾因此让 4 条构建腿全部中断）。
          for sym in bbr_reset_full_bw bbr_start_bw_probe_down \
                     bbr_handle_inflight_too_high bbr_adapt_lower_bounds; do
            if ! grep -qw "${sym}" net/ipv4/tcp_bbr.c; then
              echo "ERROR: 补丁后未找到 BBRv3 新增符号: ${sym}"
              exit 1
            fi
          done

          # 反向断言：v2 的遗留符号应当已被补丁移除
          for sym in bbr_update_bw; do
            if grep -qw "${sym}" net/ipv4/tcp_bbr.c; then
              echo "ERROR: 仍存在 BBRv2 遗留符号: ${sym}，补丁可能未完整应用。"
              exit 1
            fi
          done

          # 补丁必须确实把版本标记为 3
          grep -q '^#define BBR_VERSION[[:space:]]*3' net/ipv4/tcp_bbr.c || {
            echo "ERROR: BBR_VERSION 不是 3，补丁未正确应用。"
            exit 1
          }

          if [ "${PATCH_APPLIED_WITH_FUZZ:-0}" = "1" ]; then
            echo "::warning::BBRv3 补丁以 fuzz 方式应用，上下文与预期不符，建议尽快刷新 patches/ 中的补丁文件。"
            echo "PATCH_FUZZ_NOTE=1" >> "$GITHUB_ENV"
          fi

      - name: 应用 BBRv3 Max 极限内核配置
        if: env.BUILD_NEEDED == 'true' && matrix.profile == 'max'
        working-directory: ./kernel/linux
        run: |
          bash "$GITHUB_WORKSPACE/scripts/apply-bbrv3-max-profile.sh"

      - name: 编译声明
        if: env.BUILD_NEEDED == 'true'
        working-directory: ./kernel/linux
        run: |
          grep -v "MODULE_DESCRIPTION" net/ipv4/tcp_bbr.c > net/ipv4/tcp_bbr.c.tmp
          mv net/ipv4/tcp_bbr.c.tmp net/ipv4/tcp_bbr.c

          if [ "${{ matrix.profile }}" = "max" ]; then
            echo 'MODULE_DESCRIPTION("TCP BBR v3 Max - aggressive throughput profile");' >> net/ipv4/tcp_bbr.c
          else
            echo 'MODULE_DESCRIPTION("TCP BBR v3 (Bottleneck Bandwidth and RTT)");' >> net/ipv4/tcp_bbr.c
          fi
          
          tail -n 5 net/ipv4/tcp_bbr.c

      - name: 更新 Makefile 中的版本号
        if: env.BUILD_NEEDED == 'true'
        working-directory: ./kernel/linux
        run: |
          IFS='.' read -r v p s <<< "${{ env.KERNEL_VERSION }}"
          sed -i "s/^VERSION *=.*/VERSION = $v/" Makefile
          sed -i "s/^PATCHLEVEL *=.*/PATCHLEVEL = $p/" Makefile
          sed -i "s/^SUBLEVEL *=.*/SUBLEVEL = $s/" Makefile

      - name: 准备 .config 并禁用证书检查
        if: env.BUILD_NEEDED == 'true'
        timeout-minutes: 8
        working-directory: ./kernel/linux
        run: |
          bash "$GITHUB_WORKSPACE/scripts/prepare-kernel-config.sh" "${{ matrix.arch }}"

      - name: 上传最终配置文件
        if: env.BUILD_NEEDED == 'true' && matrix.profile == 'standard'
        uses: actions/upload-artifact@v4
        with:
          name: config-${{ matrix.arch }}-${{ matrix.profile }}-${{ env.KERNEL_VERSION }}
          path: ./build-configs/${{ matrix.arch }}*.config

      - name: 生成唯一 deb 版本号
        if: env.BUILD_NEEDED == 'true'
        working-directory: ./kernel/linux
        run: |
          # bindeb-pkg 默认版本号只由源码版本 + LOCALVERSION 组成，不含时间与 commit。
          # 同一版本重复构建会产出 dpkg 判定为"同版本"的包，导致 dpkg -i 静默跳过安装。
          # 显式设置 KDEB_PKGVERSION，用 run number 保证每次构建的版本号唯一。
          kver="$(make -s kernelversion 2>/dev/null || echo "$KERNEL_VERSION")"
          KDEB_PKGVERSION="${kver}-${GITHUB_RUN_NUMBER}"
          echo "KDEB_PKGVERSION=${KDEB_PKGVERSION}" >> "$GITHUB_ENV"
          echo "Using KDEB_PKGVERSION=${KDEB_PKGVERSION}"

      - name: 构建内核 Debian 包
        if: env.BUILD_NEEDED == 'true'
        working-directory: ./kernel/linux
        run: |
          if [ "${{ matrix.arch }}" = "arm64" ]; then
            make ARCH=arm64 bindeb-pkg -j$(nproc) LOCALVERSION=${{ matrix.localversion }} KDEB_PKGVERSION="$KDEB_PKGVERSION" KDEB_COMPRESS=gzip skipdbg=true
          else
            make bindeb-pkg -j$(nproc) LOCALVERSION=${{ matrix.localversion }} KDEB_PKGVERSION="$KDEB_PKGVERSION" KDEB_COMPRESS=gzip skipdbg=true
          fi

      - name: 检查 deb 包并生成校验和
        if: env.BUILD_NEEDED == 'true'
        run: |
          if find ./kernel -maxdepth 1 \( -name '*-dbg*.deb' -o -name '*-dbgsym*.deb' \) | grep -q .; then
            echo "ERROR: debug deb package was generated."
            find ./kernel -maxdepth 1 \( -name '*-dbg*.deb' -o -name '*-dbgsym*.deb' \) -print
            exit 1
          fi
          find ./kernel -maxdepth 1 -name 'linux-*.deb' -print | sort
          # 供安装脚本做完整性校验
          ( cd ./kernel && sha256sum linux-*.deb > SHA256SUMS )
          cat ./kernel/SHA256SUMS

      - name: 发布前复查是否已发布
        if: env.BUILD_NEEDED == 'true'
        run: |
          tag="${{ matrix.arch }}-${KERNEL_VERSION}${{ matrix.release_suffix }}"
          if [ "${FORCE_REBUILD:-false}" = "true" ]; then
            echo "PUBLISH_NEEDED=true" >> "$GITHUB_ENV"
            mkdir -p ./publish-markers
            touch "./publish-markers/${{ matrix.arch }}-${{ matrix.profile }}"
            echo "FORCE_REBUILD is enabled; publishing this build regardless of existing release."
          elif gh release view "$tag" >/dev/null 2>&1; then
            echo "PUBLISH_NEEDED=false" >> "$GITHUB_ENV"
            echo "$tag was published while this job was running; skipping upload and release."
          else
            echo "PUBLISH_NEEDED=true" >> "$GITHUB_ENV"
            mkdir -p ./publish-markers
            touch "./publish-markers/${{ matrix.arch }}-${{ matrix.profile }}"
            echo "$tag still missing; publishing this build."
          fi

      - name: 上传发布标记
        if: env.BUILD_NEEDED == 'true' && env.PUBLISH_NEEDED == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: publish-${{ matrix.arch }}-${{ matrix.profile }}-${{ env.KERNEL_VERSION }}
          path: ./publish-markers/${{ matrix.arch }}-${{ matrix.profile }}

      - name: 上传 deb 包
        if: env.BUILD_NEEDED == 'true' && env.PUBLISH_NEEDED == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: deb-${{ matrix.arch }}-${{ matrix.profile }}
          path: ./kernel/linux-*.deb

      - name: 发布到 GitHub Release
        if: env.BUILD_NEEDED == 'true' && env.PUBLISH_NEEDED == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ matrix.arch }}-${{ env.KERNEL_VERSION }}${{ matrix.release_suffix }}
          files: |
            ./kernel/linux-*.deb
            ./kernel/SHA256SUMS
            ./build-configs/${{ matrix.arch }}-${{ env.KERNEL_VERSION }}.config
          body: |
            带有 ${{ matrix.profile_name }} 的最新内核，适用于 ${{ matrix.arch }} 架构。

            Debian 包版本: ${{ env.KDEB_PKGVERSION }}
            ${{ env.PATCH_FUZZ_NOTE == '1' && '⚠️ 本次 BBRv3 补丁以 fuzz 方式应用，上下文与预期不符，请谨慎使用并尽快刷新 patches/ 中的补丁文件。' || '' }}

  update-config-baseline:
    needs: [preflight, build]
    if: ${{ always() && needs.preflight.outputs.build_needed == 'true' && needs.build.result == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}

      - name: 下载本轮最终配置
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          pattern: config-*-standard-*
          path: ./generated-configs
          merge-multiple: true

      - name: 下载发布标记
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          pattern: publish-*-standard-*
          path: ./publish-markers
          merge-multiple: true

      - name: 回写配置基线
        run: |
          set -euxo pipefail
          if [ ! -d ./publish-markers ] || ! find ./publish-markers -type f | grep -q .; then
            echo "No published architectures found; skipping baseline update."
            exit 0
          fi

          if [ ! -f ./generated-configs/x86_64.config ] && [ ! -f ./generated-configs/arm64.config ]; then
            echo "No generated configs found; nothing to update."
            exit 0
          fi

          if [ -f ./publish-markers/x86_64-standard ] && [ -f ./generated-configs/x86_64.config ]; then
            cp ./generated-configs/x86_64.config ./x86-64.config
          fi
          if [ -f ./publish-markers/arm64-standard ] && [ -f ./generated-configs/arm64.config ]; then
            cp ./generated-configs/arm64.config ./arm64.config
          fi

          if git diff --quiet -- x86-64.config arm64.config; then
            echo "Generated configs match current baselines."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add x86-64.config arm64.config
          git commit -m "Refresh generated kernel config baselines [skip ci]"
          git pull --rebase origin "${{ github.ref_name }}" || true
          git push origin "HEAD:${{ github.ref_name }}"
